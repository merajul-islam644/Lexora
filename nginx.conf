# SPA host: history-mode routes (/app/..., /login/callback) fall back to
# index.html; hashed assets cache forever.
server {
  listen 8080;
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
