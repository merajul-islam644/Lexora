# SPA host: history-mode routes (/app/..., /login/callback) fall back to
# index.html; hashed assets cache forever.
#
# Security headers (applied in both locations — nginx drops server-level
# add_header inheritance for any location that declares its own header):
#   nosniff            never guess content types
#   X-Frame-Options    no framing of the app
#   Referrer-Policy    keep full URLs inside the app's own origin
#   HSTS               TLS terminates at the platform ingress; this pins the
#                      browser to https for return visits (no preload)
#   CSP                self-hosted scripts/styles; XHR/fetch only to the app
#                      origin and the Blocks API + IAM origins; avatars load
#                      from Blocks Storage https: URLs; inline style
#                      attributes are allowed because React writes style=""
#                      everywhere ('unsafe-inline' does NOT relax script-src).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://blocksapi.slsblx.com https://iam.seliseblocks.com; font-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://blocksapi.slsblx.com https://iam.seliseblocks.com; font-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
